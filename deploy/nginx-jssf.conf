# JSSF — nginx reverse proxy.
# /api/v1/* -> Express backend :4000, everything else -> Next.js :3000.
# Same-origin routing keeps the httpOnly cookie auth working unchanged.
# certbot rewrites this file for HTTPS during setup.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # customer photos / aadhaar / bills go through the API
    client_max_body_size 10m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js HMR/websocket headers are harmless in prod, useful if ever needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
