# JSSF — nginx reverse proxy, terminating TLS with a Cloudflare Origin cert.
# /api/v1/* -> Express backend :4000, everything else -> Next.js :3000.
# Same-origin routing keeps the httpOnly cookie auth working unchanged.
#
# Cloudflare sits in front (SSL/TLS mode: Full (strict)). The public cert
# browsers see is Cloudflare's edge cert; this server only needs the
# Cloudflare Origin cert for the Cloudflare <-> origin leg.

# Redirect plain HTTP to HTTPS (Cloudflare also does this, belt-and-suspenders).
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    # Cloudflare Origin certificate (installed by setup-server.sh).
    ssl_certificate     /etc/ssl/cloudflare/jssf.crt;
    ssl_certificate_key /etc/ssl/cloudflare/jssf.key;

    # Optional hardening — only accept TLS from Cloudflare (Authenticated
    # Origin Pulls). Enable after downloading Cloudflare's origin-pull CA to
    # /etc/ssl/cloudflare/origin_pull_ca.pem, then uncomment:
    # ssl_client_certificate /etc/ssl/cloudflare/origin_pull_ca.pem;
    # ssl_verify_client on;

    # customer photos / aadhaar / bills go through the API
    client_max_body_size 10m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js HMR/websocket headers are harmless in prod, useful if ever needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
